name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version

      # VoiceOver: icon-only buttons need a label, controls need a title.
      - name: Accessibility lint
        run: python3 scripts/lint-accessibility.py

      - name: Test and build
        env:
          KONGPRISM_ARCH: arm64
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export KONGPRISM_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash scripts/build-app.sh --test --zip --dmg

      # Low power is a requirement: measure idle CPU time of the app and of the core on a real Mac.
      - name: Idle energy check
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cpu() { ps -o cputime= -p "$1" | python3 -c 'import sys; p=sys.stdin.read().strip().replace(",",".").split(":"); print(sum(float(x)*60**i for i,x in enumerate(reversed(p))))'; }
          # The core, idle with a direct-only config.
          cat > /tmp/idle.json <<'JSON'
          {"log":{"level":"warn"},"inbounds":[{"type":"mixed","listen":"127.0.0.1","listen_port":17999}],
           "outbounds":[{"type":"direct","tag":"direct"}],
           "experimental":{"clash_api":{"external_controller":"127.0.0.1:19999","secret":"x"}}}
          JSON
          build/KongPrism.app/Contents/MacOS/sing-box run -c /tmp/idle.json >/tmp/idle.log 2>&1 &
          core=$!
          # The app (no subscription: it opens the settings window and waits).
          open build/KongPrism.app
          sleep 10
          app="$(pgrep -x KongPrism | head -1)"
          a0="$(cpu "$app")"; c0="$(cpu "$core")"
          sleep 60
          a1="$(cpu "$app")"; c1="$(cpu "$core")"
          # Resident memory (KB) of both processes after a minute of idling.
          am="$(ps -o rss= -p "$app" | tr -d ' ')"; cm="$(ps -o rss= -p "$core" | tr -d ' ')"
          python3 - "$a0" "$a1" "$c0" "$c1" "$am" "$cm" <<'PY'
          import sys
          a0, a1, c0, c1, am, cm = map(float, sys.argv[1:])
          app, core = a1 - a0, c1 - c0
          print(f"Idle CPU over 60 s: KongPrism {app:.2f} s ({app/60*100:.2f}%), sing-box {core:.2f} s ({core/60*100:.2f}%)")
          print(f"Idle memory (RSS): KongPrism {am/1024:.0f} MB, sing-box {cm/1024:.0f} MB")
          assert app < 0.6, "KongPrism uses CPU while idle"
          assert core < 0.6, "sing-box uses CPU while idle"
          # Thresholds: a menu-bar app with one SwiftUI window open, and an idle core.
          assert am < 200 * 1024, "KongPrism uses too much memory while idle (limit 200 MB)"
          assert cm < 100 * 1024, "sing-box uses too much memory while idle (limit 100 MB)"
          PY
          top -l 2 -s 5 -pid "$app" -stats pid,command,cpu,idlew 2>/dev/null | tail -2 || true
          kill "$core" || true
          osascript -e 'tell application id "com.kongxiangrui.KongPrism" to quit' || pkill -x KongPrism || true

      # The enhanced-mode helper, exactly as the app installs it, on a real Mac (the runner has
      # passwordless sudo): root sing-box with a TUN interface, real traffic through it, then stop.
      - name: Enhanced mode (TUN) end to end
        timeout-minutes: 6
        run: |
          set -euo pipefail
          app="build/KongPrism.app"
          helper=/Library/PrivilegedHelperTools/com.kongxiangrui.KongPrism.tun
          root="/Library/Application Support/KongPrismTUN"
          runtime="$HOME/Library/Application Support/KongPrism/runtime"
          mkdir -p "$runtime"
          python3 - "$runtime/config.json" <<'PY'
          import json, sys
          json.dump({
            "log": {"level": "info", "output": "/tmp/kongprism-must-not-write.log"},
            "dns": {"servers": [{"type": "udp", "tag": "d", "server": "8.8.8.8"}]},
            "inbounds": [
              {"type": "mixed", "tag": "mixed-in", "listen": "127.0.0.1", "listen_port": 17899},
              {"type": "tun", "tag": "tun-in", "address": ["172.19.0.1/30", "fdfe:dcba:9876::1/126"], "auto_route": True, "stack": "mixed"}],
            "outbounds": [{"type": "direct", "tag": "direct"}],
            "route": {"auto_detect_interface": True, "final": "direct", "default_domain_resolver": "d",
                      "rules": [{"action": "sniff"}, {"protocol": "dns", "action": "hijack-dns"}]},
            "experimental": {"cache_file": {"enabled": True, "path": "/tmp/kongprism-must-not-write.db"},
                             "clash_api": {"external_controller": "127.0.0.1:19099", "secret": "ci", "external_ui": "/tmp/ui"}}
          }, open(sys.argv[1], "w"))
          PY
          sudo /usr/bin/install -d -m 755 -o root -g wheel /Library/PrivilegedHelperTools "$root"
          sudo /usr/bin/install -m 755 -o root -g wheel "$app/Contents/Resources/tun-helper.sh" "$helper"
          sudo /usr/bin/install -m 755 -o root -g wheel "$app/Contents/MacOS/sing-box" /Library/PrivilegedHelperTools/com.kongxiangrui.KongPrism.sing-box
          echo "$(whoami) ALL=(root) NOPASSWD: $helper start, $helper stop, $helper status" > /tmp/kongprism-sudoers
          sudo /usr/sbin/visudo -cf /tmp/kongprism-sudoers
          trap 'sudo "$helper" stop || true; sudo cat "$root/stderr.log" 2>/dev/null | tail -20 || true' EXIT

          sudo "$helper" start
          test "$(sudo "$helper" status)" = running
          echo "root config rewritten:"; sudo python3 -c "import json,sys; c=json.load(open(sys.argv[1])); print(c['log']['output'], c['experimental']['cache_file']['path'], 'external_ui' in c['experimental']['clash_api'])" "$root/config.json"
          sudo python3 -c "import json,sys; c=json.load(open(sys.argv[1])); r=sys.argv[2]; assert c['log']['output']==r+'/core.log' and c['experimental']['cache_file']['path']==r+'/cache.db' and 'external_ui' not in c['experimental']['clash_api']" "$root/config.json" "$root"
          test ! -e /tmp/kongprism-must-not-write.log
          sleep 2
          route -n get 1.1.1.1 | tee /tmp/route.txt
          grep -q "interface: utun" /tmp/route.txt
          code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://www.apple.com/library/test/success.html)"
          echo "HTTP $code through TUN"; test "$code" = 200
          total="$(curl -s -H 'Authorization: Bearer ci' http://127.0.0.1:19099/connections | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadTotal"])')"
          echo "bytes through sing-box: $total"; test "$total" -gt 0
          sudo "$helper" stop
          test "$(sudo "$helper" status)" = stopped
          ! route -n get 1.1.1.1 | grep -q "interface: utun"

      # Every feature on a real Mac: install, subscription, rule-sets, connect, Google through a
      # node, node / mode switching, memory, screenshots of each settings page, problem report,
      # disconnect, crash detection. See scripts/ci-walkthrough.sh.
      - name: Real-Mac walkthrough
        timeout-minutes: 28
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/KongPrism.app
          ditto build/KongPrism.app /Applications/KongPrism.app
          # Only one copy, so kongprism:// links reach the installed app.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -u build/KongPrism.app || true
          mv build/KongPrism.app "$RUNNER_TEMP/KongPrism-build.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/KongPrism.app
          SHOTS="$PWD/build/walkthrough" bash scripts/ci-walkthrough.sh

      # Also into the log (small JPEGs, base64), for reviewers who cannot download artifacts.
      - name: Print walkthrough screenshots
        if: always()
        run: |
          for f in build/walkthrough/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 55 -Z 1100 "$f" --out /tmp/shot.jpg >/dev/null
            echo "SHOT-BEGIN $(basename "$f" .png)"; base64 -i /tmp/shot.jpg | fold -w 1000; echo "SHOT-END"
          done

      - name: Upload walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough
          path: build/walkthrough
          if-no-files-found: ignore

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: KongPrism
          path: |
            build/KongPrism-*.zip
            build/KongPrism-*.dmg
            build/core.sha256
            build/build.log
          if-no-files-found: error

      # A release is published when main carries a version (Resources/Info.plist) that has no
      # release yet, or when a v* tag is pushed. So releasing = bump the version + CHANGELOG, push.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version 已发布过，跳过"
            exit 0
          fi
          zip="build/KongPrism-$version.zip"
          sha="$(cat "$zip.sha256")"
          lite="build/KongPrism-$version-lite.zip"
          lite_sha="$(cat "$lite.sha256")"
          core_sha="$(cat build/core.sha256)"
          # Is the core byte-identical to the previous release's? (Then 0.9+ apps download only the lite zip.)
          previous_core="$(curl -sL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("coreSha256",""))' 2>/dev/null || true)"
          echo "内核 SHA-256：$core_sha；上一版：${previous_core:-（没有记录）}"
          build="$(git rev-list --count HEAD)"
          # Release notes: the CHANGELOG section of this version.
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {p=1; next} /^## / {if (p) exit} p' CHANGELOG.md > notes.md || true
          [[ -s notes.md ]] || echo "KongPrism $version" > notes.md
          python3 - "$version" "$build" "$sha" "KongPrism-$version.zip" "KongPrism-$version-lite.zip" "$lite_sha" "$core_sha" <<'PY'
          import json, sys
          version, build, sha, asset, lite, lite_sha, core_sha = sys.argv[1:8]
          notes = open("notes.md", encoding="utf-8").read().strip()
          json.dump({"version": version, "build": int(build), "notes": notes, "asset": asset,
                     "sha256": sha, "minimumSystemVersion": "13.0",
                     "liteAsset": lite, "liteSha256": lite_sha, "coreSha256": core_sha},
                    open("latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          cat latest.json
          gh release create "v$version" "$zip" "$lite" "build/KongPrism-$version.dmg" latest.json --target "$GITHUB_SHA" --title "KongPrism $version" --notes-file notes.md
