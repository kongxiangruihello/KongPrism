name: probe
on:
  push:
    branches: [claude/updater-probe]
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Replay the in-app update steps on the published release
        run: |
          set -x
          cd /tmp
          curl -sSL -o latest.json https://github.com/kongxiangruihello/KongPrism/releases/latest/download/latest.json
          cat latest.json
          asset=$(python3 -c "import json;print(json.load(open('latest.json'))['asset'])")
          want=$(python3 -c "import json;print(json.load(open('latest.json'))['sha256'])")
          curl -sSL -o "$asset" "https://github.com/kongxiangruihello/KongPrism/releases/latest/download/$asset"
          got=$(shasum -a 256 "$asset" | awk '{print $1}')
          echo "sha want=$want got=$got"; [ "$want" = "$got" ] && echo "SHA: OK" || echo "SHA: MISMATCH"
          mkdir work && /usr/bin/ditto -x -k "$asset" work && echo "UNZIP: OK" && ls work
          /usr/bin/defaults read "$PWD/work/KongPrism.app/Contents/Info" CFBundleIdentifier
          /usr/bin/defaults read "$PWD/work/KongPrism.app/Contents/Info" CFBundleShortVersionString
          /usr/bin/codesign --verify --deep work/KongPrism.app; echo "CODESIGN deep exit=$?"
          /usr/bin/codesign --verify --deep --strict --verbose=4 work/KongPrism.app 2>&1 | tail -5
          /usr/bin/codesign -dvvv work/KongPrism.app 2>&1 | grep -E "Identifier|Signature|Sealed|flags" 
